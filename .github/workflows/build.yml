name: build

on:
  push:
    branches: ["**"]
    tags: ["v*", "fork-*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release with the APK"
        type: boolean
        default: true
      tag:
        description: "Release tag (manual dispatch only)"
        default: "lumina-browser-latest"
      fork:
        description: "Also build the DuckDuckGo fork APK (heavy, ~25 min)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  # ---------------------------------------------------------------------------
  # The real thing: fork DuckDuckGo, rebrand it, build a browser APK.
  # Manual only: heavy (~25 min) and expected to fail until P3/P4 wiring lands.
  # ---------------------------------------------------------------------------
  browser-fork-apk:
    # run manually (inputs.fork) or by pushing a tag named fork-* — that is how the
    # fork/rebrand path gets verified without touching the default branch
    if: inputs.fork == true || startsWith(github.ref, 'refs/tags/fork-')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 (upstream needs it for the Metro compiler plugin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # GITHUB_PATH only applies to the NEXT step — so the SDK env is set here and
      # sdkmanager is used in the following step.
      - name: Android SDK env
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install platform 36
        run: |
          (yes | sdkmanager --licenses > /dev/null) || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || \
            sdkmanager "platforms;android-35" "build-tools;35.0.0"
          # httpsupgrade-impl builds C++ with CMake + NDK 30 (pinned by upstream)
          sdkmanager "ndk;30.0.16248370" "cmake;3.22.1" || true
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fork + rebrand
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/*.sh
          set +e
          SKIP_NPM=0 ./scripts/p0-fork.sh 2>&1 | tee /tmp/fork.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # the run log is not reachable from every environment; an issue is
            { echo "### fork/rebrand failed (exit $code)"; echo '```'; tail -c 7000 /tmp/fork.log; echo '```'; } > /tmp/body.md
            gh issue create -R "${{ github.repository }}" --title "fork log $(date -u +%FT%TZ)" --body-file /tmp/body.md || true
            exit "$code"
          fi

      - name: Wire the glass UI into the fork (P3)
        run: python3 scripts/p3_wire_ntp.py --repo app-fork

      - name: Build browser APK
        working-directory: app-fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./gradlew :app:assembleInternalDebug -Pskip-onboarding -x lint -x test --build-cache --parallel --stacktrace --no-daemon 2>&1 | tee /tmp/assemble.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "### browser assemble failed (exit $code)"
              echo '```'
              grep -E "^> Task .*FAILED|^FAILURE:|^e: |error: |Caused by:" /tmp/assemble.log | head -20
              grep -A8 "CMake Error" /tmp/assemble.log | head -20
              echo '---'
              sed -n '/What went wrong/,+15p' /tmp/assemble.log | head -30
              echo '```'
            } > /tmp/abody.md
            # gh infers the repo from cwd — app-fork has origin=duckduckgo/Android, so be explicit
            cd "$GITHUB_WORKSPACE"
            gh issue create -R "${{ github.repository }}" --title "assemble log $(date -u +%FT%TZ)" --body-file /tmp/abody.md || true
            exit "$code"
          fi

      - name: Upload browser APK
        uses: actions/upload-artifact@v4
        with:
          name: lumina-browser-debug
          path: app-fork/app/build/outputs/apk/internal/debug/*.apk
          if-no-files-found: warn

      - name: Publish browser APK
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          cp app-fork/app/build/outputs/apk/internal/debug/*.apk out/lumina-browser.apk
          ls -lh out/
          TAG="${GITHUB_REF_NAME}-browser"
          NOTES="Lumina browser — DuckDuckGo engine, rebranded to app.lumina.browser, with the
          Lumina start page wired in (GlassSurface glass via skydoves/Cloudy backdrop blur).
          Still DuckDuckGo: search results page, tabs, settings and menus are upstream UI, and
          telemetry removal + APK diet are pending. Debug build, debug-signed: enable
          'install unknown apps'."
          gh release create "$TAG" out/lumina-browser.apk \
            --title "Lumina browser $TAG" --notes "$NOTES" \
            || gh release upload "$TAG" out/lumina-browser.apk --clobber
